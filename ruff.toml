# Lint gate for `ruff check src tests`.
target-version = "py311"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = [
    "B905",   # zip() without strict=: adding strict= changes behavior; keep zip() as written
    "UP042",  # (str, Enum) -> StrEnum changes str()/format() output of persisted enum values
]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["src", "tests"]
