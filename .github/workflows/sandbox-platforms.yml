# ADR-072: the sandbox configuration must work on Linux, macOS and Windows.
# Runs the platform tests and a real worker load/abuse smoke on each OS.
name: sandbox-platforms

on:
  push:
    paths: ["src/sandbox/**", "deploy/sandbox/**", "src/evaluation/run_sandbox_load_eval.py",
            "tests/sandbox/test_host_platforms.py", ".github/workflows/sandbox-platforms.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  sandbox:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - name: Platform boundary tests
        run: python -m pytest tests/sandbox/test_host_platforms.py tests/serving/test_providers.py -q
      - name: Real workers - benign load, abuse containment, leak checks
        run: >
          python -m src.evaluation.run_sandbox_load_eval --concurrency 1,4
          --output sandbox-load-${{ matrix.os }}-${{ matrix.python }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-load-${{ matrix.os }}-${{ matrix.python }}
          path: sandbox-load-*.json

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-test.txt
      - name: Build the worker image and run the load smoke through container-v1
        run: |
          docker build -f deploy/sandbox/container/Dockerfile -t localhost:5000/ai-financial-sandbox:ci .
          docker run -d -p 5000:5000 --name registry registry:2
          docker push localhost:5000/ai-financial-sandbox:ci
          export SANDBOX_CONTAINER_IMAGE=$(docker image inspect --format '{{index .RepoDigests 0}}' localhost:5000/ai-financial-sandbox:ci)
          M7_SANDBOX_ISOLATION=container-v1 python -m src.evaluation.run_sandbox_load_eval \
            --concurrency 1,4 --output sandbox-load-container.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sandbox-load-container
          path: sandbox-load-container.json
