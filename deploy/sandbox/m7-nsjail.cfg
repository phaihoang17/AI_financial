name: "m7-linux-nsjail-v1"
description: "One-shot production boundary for the trusted financial DSL worker"
mode: ONCE
hostname: "m7-worker"
cwd: "/opt/ai-financial"

# The parent keeps the exact 1.5 second wall timeout. NsJail's integer limit is
# an additive hard stop; the worker installs the exact 1s/2s CPU soft/hard pair.
time_limit: 2
max_cpus: 1
daemon: false
keep_env: true
keep_caps: false
silent: false
stderr_to_null: true
skip_setsid: false
disable_no_new_privs: false

rlimit_as: 256
rlimit_as_type: VALUE
rlimit_core: 0
rlimit_core_type: VALUE
rlimit_cpu: 2
rlimit_cpu_type: VALUE
rlimit_fsize: 0
rlimit_fsize_type: VALUE
rlimit_nofile: 32
rlimit_nofile_type: VALUE
rlimit_nproc: 1
rlimit_nproc_type: VALUE

clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
mount_proc: false
iface_no_lo: true

uidmap {
  inside_id: "65534"
  outside_id: ""
  count: 1
}
gidmap {
  inside_id: "65534"
  outside_id: ""
  count: 1
}

# The production image installs Python under /usr and only the application
# source package at the fixed path below. No repository root, corpus,
# credential, host root, writable tmpfs, /proc, or container-runtime socket is
# mounted into the jail.
mount {
  src: "/usr"
  dst: "/usr"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
}
mount {
  src: "/lib"
  dst: "/lib"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  mandatory: false
}
mount {
  src: "/lib64"
  dst: "/lib64"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
  mandatory: false
}
mount {
  src: "/opt/ai-financial/src"
  dst: "/opt/ai-financial/src"
  is_bind: true
  rw: false
  nosuid: true
  nodev: true
}

detect_cgroupv2: true
cgroup_mem_max: 268435456
cgroup_mem_memsw_max: 268435456
cgroup_mem_swap_max: 0
cgroup_pids_max: 1
cgroup_cpu_ms_per_sec: 1000

seccomp_policy_file: "/opt/ai-financial/deploy/sandbox/m7-seccomp.policy"
