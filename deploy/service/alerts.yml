# Generated by src/service/alerting.py from deploy/service/slo.toml; do not edit by hand.
groups:
  - name: aifin-service
    rules:
      - alert: AifinAvailabilityBudgetBurnFast
        expr: |
          (sum(increase(aifin_slo_events_total{kind="bad"}[1h])) / sum(increase(aifin_slo_events_total{kind="total"}[1h]))) > 0.072
          and
          (sum(increase(aifin_slo_events_total{kind="bad"}[5m])) / sum(increase(aifin_slo_events_total{kind="total"}[5m]))) > 0.072
        for: 120s
        labels:
          severity: page
        annotations:
          summary: "Availability error budget burning fast (1h and 5m windows)"
      - alert: AifinAvailabilityBudgetBurnSlow
        expr: |
          (sum(increase(aifin_slo_events_total{kind="bad"}[6h])) / sum(increase(aifin_slo_events_total{kind="total"}[6h]))) > 0.03
          and
          (sum(increase(aifin_slo_events_total{kind="bad"}[30m])) / sum(increase(aifin_slo_events_total{kind="total"}[30m]))) > 0.03
        for: 900s
        labels:
          severity: ticket
        annotations:
          summary: "Availability error budget burning (6h and 30m windows)"
      - alert: AifinAnswerLatencySLO
        expr: |
          (increase(aifin_answer_slow_total[30m]) / increase(aifin_answered_total[30m])) > 0.1
          and
          (increase(aifin_answer_slow_total[5m]) / increase(aifin_answered_total[5m])) > 0.1
        for: 600s
        labels:
          severity: ticket
        annotations:
          summary: "Too many answers slower than the latency SLO threshold"
      - alert: AifinNotReady
        expr: |
          aifin_ready == 0
        for: 60s
        labels:
          severity: page
        annotations:
          summary: "Serving release is not ready"
      - alert: AifinOverloaded
        expr: |
          increase(aifin_overload_rejections_total[5m]) > 0
        for: 300s
        labels:
          severity: ticket
        annotations:
          summary: "Admission control is rejecting requests"
      - alert: AifinSandboxSecurityEvent
        expr: |
          increase(aifin_sandbox_security_events_total[5m]) > 0
        for: 0s
        labels:
          severity: ticket
        annotations:
          summary: "Generated code attempted a denied sandbox capability"
